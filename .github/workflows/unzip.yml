name: Unzip archive

on:
  push:
    paths:
      - "*.zip"   # déclenche seulement si un zip est ajouté

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install unzip
        run: sudo apt-get install -y unzip

      - name: Extract zip
        run: unzip my_archive.zip -d extracted_content

      - name: Commit extracted files
      permissions:
  contents: write
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add extracted_content
          git commit -m "Unzipped archive"
          git push
